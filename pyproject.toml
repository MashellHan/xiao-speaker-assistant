[project]
name = "xiao-speaker-assistant"
version = "0.1.0"
description = "Voice AI assistant bridge for Xiaomi Smart Speaker Pro (OH2P) on macOS/Linux/Docker with OpenAI-compatible/Gemini/OpenCode LLMs, local KWS/AEC/voiceprint, Web Console, and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "edge-tts>=7.3.1",
    "httpx>=0.27.0",
    "msal>=1.31.0",
    "numpy>=2.4.6",
    "pydantic>=2.8.0",
    "pypinyin>=0.55.0",
    "pyyaml>=6.0.2",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.3",
    "sherpa-onnx>=2.0.3",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
xsa = "xiao_speaker_assistant.cli:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xiao_speaker_assistant.web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

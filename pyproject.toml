[project]
name = "xiao-speaker-assistant"
version = "0.1.0"
description = "Voice AI assistant bridge for Xiaomi Smart Speaker Pro (OH2P) running on macOS with Codex, Gemini, Outlook, Browser, and Xiaohongshu MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "msal>=1.31.0",
    "numpy>=2.4.6",
    "pydantic>=2.8.0",
    "pypinyin>=0.55.0",
    "pyyaml>=6.0.2",
    "sherpa-onnx>=2.0.3",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
xsa = "xiao_speaker_assistant.cli:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

services:
  xiao-speaker-assistant:
    build: .
    container_name: xiao-speaker-assistant
    restart: unless-stopped
    ports:
      - "127.0.0.1:4397:4397"
      - "4399:4399"
    environment:
      # Configure one LLM API key (recommended for Docker: openai_compatible or gemini_api)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Optional pluggable web search (Tavily or self-hosted SearXNG)
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SEARXNG_URL=${SEARXNG_URL:-}
      # Optional WAN relay & Web Console remote auth
      - XSA_RELAY_HOST_TOKEN=${XSA_RELAY_HOST_TOKEN:-}
      - XSA_CONSOLE_TOKEN=${XSA_CONSOLE_TOKEN:-}
      - HOME=/data
    volumes:
      - ./data:/data
      - ./models:/app/models
    command: ["serve", "--config", "/data/config.yaml", "--asr", "sense_voice"]

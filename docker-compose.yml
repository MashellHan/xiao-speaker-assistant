services:
  xiao-speaker-assistant:
    build: .
    container_name: xiao-speaker-assistant
    restart: unless-stopped
    ports:
      - "127.0.0.1:4397:4397"
      - "4399:4399"
    environment:
      # Configure one LLM API key (recommended for Docker: openai_compatible or gemini_api)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Optional pluggable web search (Tavily or self-hosted SearXNG)
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SEARXNG_URL=${SEARXNG_URL:-}
      # Optional Cloud ASR & Speaker / WAN Relay auth
      - DOUBAO_ASR_APP_KEY=${DOUBAO_ASR_APP_KEY:-}
      - DOUBAO_ASR_ACCESS_KEY=${DOUBAO_ASR_ACCESS_KEY:-}
      - XSA_SPEAKER_TOKEN=${XSA_SPEAKER_TOKEN:-}
      - XSA_RELAY_TOKEN=${XSA_RELAY_TOKEN:-}
      - XSA_RELAY_HOST_TOKEN=${XSA_RELAY_HOST_TOKEN:-}
      # Remote Web Console login password (required when accessed across Docker bridge)
      - XSA_CONSOLE_PASSWORD=${XSA_CONSOLE_PASSWORD:-}
      - HOME=/data
    volumes:
      - ./data:/data
      - ./models:/app/models
    command: ["--config", "/data/config.yaml", "serve", "--mcp-host", "0.0.0.0", "--asr", "sense_voice"]

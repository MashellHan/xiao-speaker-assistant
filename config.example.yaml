# Copy to config.yaml (ignored by git) via `uv run xsa init` and customize.
# Supports OpenAI-compatible APIs (OpenAI / DeepSeek / SiliconFlow / Ollama), Gemini API,
# or local `opencode` / `codex` CLI.

speaker:
  model: OH2P
  ws_host: 0.0.0.0
  ws_port: 4399
  auth_token_env: XSA_SPEAKER_TOKEN
  tts_provider: edge # edge | say | xiaoai
  edge_voice: zh-CN-XiaoyiNeural
  edge_rate: "+8%"
  # Optional per-wake-word voice routing:
  # voice_routes:
  #   你好管家: zh-CN-YunxiNeural
  #   hi_nomi: zh-CN-XiaoyiNeural
  say_voice: Tingting
  tts_sample_rate: 24000
  tool_ack_enabled: true
  tool_ack_delay_sec: 3.5

speech:
  local_keywords:
    - 糯米糯米
    - 诺米诺米
  en_keywords:
    - HEY NUOMI
    - HEY NOMI
    - HEY NOUMI
    - HEY NAOMI
    - HI NOMI
    - HI NUOMI
    - HI NAOMI
    - NI NAOMI
  speaker_id_enabled: true
  speaker_id_threshold: 0.45
  speaker_profiles_file: ~/.local/share/xiao-speaker-assistant/speakers.json
  interrupt_keywords:
    - 退出
    - 停止
    - 闭嘴
    - 退下
    - 别说了
    - 再见
  asr_provider: sense_voice # sense_voice | xiaoai_asr
  asr_model: sense_voice # sense_voice | paraformer | doubao_flash | openai_whisper
  asr_language: auto # auto | zh | en
  en_kws_enabled: true
  capture_channels: 1
  capture_bits_per_sample: 16
  input_gain: 16.0
  agc_enabled: false
  vad_threshold: 0.12
  kws_score: 2.0
  kws_threshold: 0.20
  aec_enabled: false
  models_dir: models
  vad_min_silence_ms: 450

llm:
  # Recommended for new users: `openai_compatible` (works with OpenAI, DeepSeek, Ollama, etc.)
  # or `gemini_api` / `opencode` / `codex`.
  default_provider: openai_compatible # openai_compatible | gemini_api | opencode | codex
  spoken_max_chars: 220
  # Optional custom model dropdown options shown in the Web Console:
  # available_models:
  #   - id: gpt-4o-mini
  #     label: GPT-4o Mini
  #   - id: deepseek-chat
  #     label: DeepSeek Chat
  providers:
    codex_api:
      # Used by `openai_compatible` (and legacy `codex_api`)
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: gpt-4o-mini
    gemini_api:
      api_key_env: GEMINI_API_KEY
      model: gemini-2.5-flash
    opencode:
      binary: opencode
      model: openai/gpt-4o-mini
      timeout_sec: 45
      auto_approve: true
      server_url: http://127.0.0.1:4396
      agent_home: ~/.local/share/xiao-speaker-assistant/agent-home
      auto_start_server: true
    codex:
      binary: codex
      workdir: .
      timeout_sec: 120

tools:
  mcp_http_port: 4397
  outlook:
    enabled: false
    client_id_env: OUTLOOK_CLIENT_ID
    tenant_id: consumers
    token_cache_file: ~/.config/xiao-speaker-assistant/outlook_token_cache.json
    require_voice_confirmation_for_send: true
  xiaohongshu:
    enabled: false
    mcp_url: http://127.0.0.1:18060/mcp
  browser:
    enabled: false
    mcp_url: http://127.0.0.1:8931/mcp
    preferred_browser: msedge

persona:
  assistant_name: Nomi
  address_user_as: ""
  style: 亲切自然、简短口语化、直接给出核心结论
  extra_instructions: ""
  default_city: 北京
  timezone: Asia/Shanghai
  reply_language: zh-CN # zh-CN | en | auto

memory:
  enabled: true
  file_path: ~/.local/share/xiao-speaker-assistant/memory.json
  max_prompt_items: 12

reminders:
  enabled: true
  file_path: ~/.local/share/xiao-speaker-assistant/reminders.json
  quiet_start_hhmm: "23:00"
  quiet_end_hhmm: "07:00"

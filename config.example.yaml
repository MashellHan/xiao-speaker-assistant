# Copy to config.yaml (ignored by git) and customize.
# Uses local `opencode` (raven proxy / Gemini) and `codex` CLI — no API keys needed.

speaker:
  model: OH2P
  ws_host: 0.0.0.0
  ws_port: 4399
  auth_token_env: XSA_SPEAKER_TOKEN
  tts_provider: edge # edge | say | xiaoai | openai | mlx_audio
  edge_voice: zh-CN-XiaoxiaoNeural
  edge_rate: "+8%"
  # Optional per-wake-word voice routing:
  # voice_routes:
  #   你好管家: zh-CN-YunxiNeural
  #   hi_nomi: zh-CN-XiaoyiNeural
  say_voice: Tingting
  tts_sample_rate: 24000

speech:
  local_keywords:
    - 你好管家
    - 你好诺米
    - 你好糯米
    - 嗨糯米
  interrupt_keywords:
    - 退出
    - 停止
    - 闭嘴
    - 退下
    - 别说了
    - 再见
  asr_provider: sense_voice # sense_voice | xiaoai_asr
  asr_model: sense_voice # sense_voice | paraformer | doubao_flash | openai_whisper
  asr_language: auto # auto | zh | en
  en_kws_enabled: true
  capture_channels: 1
  capture_bits_per_sample: 16
  input_gain: 16.0
  agc_enabled: false
  vad_threshold: 0.12
  kws_score: 2.0
  kws_threshold: 0.20
  aec_enabled: false
  models_dir: models
  vad_min_silence_ms: 550

llm:
  default_provider: opencode # opencode | codex | codex_api | gemini_api
  spoken_max_chars: 220
  providers:
    opencode:
      binary: opencode
      model: raven/gemini-4-hydrogen
      timeout_sec: 120
      auto_approve: true
      server_url: http://127.0.0.1:4396
      agent_home: ~/.local/share/xiao-speaker-assistant/agent-home
      auto_start_server: true
    codex:
      binary: codex
      workdir: .
      timeout_sec: 120

tools:
  mcp_http_port: 4397
  outlook:
    enabled: true
    client_id_env: OUTLOOK_CLIENT_ID
    tenant_id: consumers
    token_cache_file: ~/.config/xiao-speaker-assistant/outlook_token_cache.json
    require_voice_confirmation_for_send: true
  xiaohongshu:
    enabled: false
    mcp_url: http://127.0.0.1:18060/mcp
  browser:
    enabled: false
    mcp_url: http://127.0.0.1:8931/mcp
    preferred_browser: msedge

persona:
  assistant_name: Nomi
  address_user_as: ""
  style: 亲切自然、简短口语化、直接给出核心结论
  extra_instructions: ""

memory:
  enabled: true
  file_path: ~/.local/share/xiao-speaker-assistant/memory.json
  max_prompt_items: 12
